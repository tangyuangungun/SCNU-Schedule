import java.util.Properties

plugins {
    id "com.android.application"
}

def keystoreProperties = new Properties()
def keystorePropertiesPath = System.getenv("SCNU_KEYSTORE_PROPERTIES")
def keystorePropertiesFile = keystorePropertiesPath ? file(keystorePropertiesPath) : null
if (keystorePropertiesFile != null && keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def requiresReleaseSigning = gradle.startParameter.taskNames.any { task ->
    task.toLowerCase().contains("release")
}
if (requiresReleaseSigning && (keystorePropertiesFile == null || !keystorePropertiesFile.exists())) {
    throw new GradleException("Release build requires SCNU_KEYSTORE_PROPERTIES pointing to an external keystore.properties file.")
}

android {
    namespace "cn.edu.scnu.schedule"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "cn.edu.scnu.schedule"
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName "1.4.2"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile != null && keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile != null && keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

